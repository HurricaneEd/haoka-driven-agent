services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: haoka-agent
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////usr/src/app/data/customer_support.db
    env_file:
      - .env
    volumes:
      - ./chroma_db:/usr/src/app/chroma_db
      - ./data:/usr/src/app/data
    restart: unless-stopped
